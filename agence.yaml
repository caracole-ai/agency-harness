# La config de l'agence (PLAN-RONDE.md § 4.1, R7 ; amendée par son § 0.a) :
# les modèles du chantier (qui code un geste commandé par le patron), leurs
# prix, les bornes. Sans secret. Le quotidien d'un client (traduction,
# échappée) ne passe pas par ici : sa config désigne son modèle.
#
# acces: claude    = l'abonnement claude.ai, par le binaire `claude` : le
#                    laboratoire, jusqu'à la finalisation (§ 0.a). Préflight :
#                    `claude auth status` connecté, ANTHROPIC_API_KEY absente.
#                    Le coût est celui que le binaire rapporte : « estimé par
#                    le binaire », jamais « mesuré ».
# acces: anthropic = la clé d'API de l'agence (ANTHROPIC_API_KEY), le mode de
#                    PLAN-GENERAL.md G10. La bascule doit avoir lieu avant la
#                    finalisation (PLAN-LIVRAISON.md § 6) ; tout se mesure à
#                    nouveau ce jour-là.
modeles:
  chantier:
    plan: { acces: claude, modele: claude-fable-5-1, effort: high }
    implementation: { acces: claude, modele: claude-opus-5-5, effort: high }
    revue: { acces: claude, modele: claude-fable-5-1, effort: high }

# Dollars par million de tokens, relus dans la doc d'Anthropic le 2026-10-11
# (platform.claude.com/docs/en/about-claude/pricing ; écriture de cache à 5 min).
# Servent à l'estimation sous acces: anthropic ; sous acces: claude, le
# binaire rapporte son propre coût.
prix_par_million_usd:
  claude-fable-5-1: { entree: 10, sortie: 50, cache_ecrit: 12.5, cache_lu: 0.25 }
  claude-opus-5-5: { entree: 4, sortie: 20, cache_ecrit: 5, cache_lu: 0.2 }

# Le binaire de Claude Code (acces: claude) : son nom, ou un chemin.
claude:
  binaire: claude

# Chaque fusion et chaque retrait posent une version : une étiquette git
# signée avec la clé SSH de l'agence, désignée par la variable
# AGENCE_CLE_SIGNATURE (un chemin hors du dépôt, jamais ici ; L4).
#
# Le chantier tourne à l'agence, au clic du patron (PLAN-LIVRAISON.md L1, L2) :
# dans des arbres de travail de ce dépôt partis d'`origin/main`
# (`.claude/worktrees/`), la fusion dans un arbre détaché, poussée sur `main`
# du distant ; ni l'arbre de qui lance ni sa branche `main` ne bougent.
# `pnpm agence` : au plus `chantiers_max_par_jour` chantiers lancés par jour
# (comptés au registre de l'agence, `.claude/missions/chantiers.log`, jamais
# sur ce qu'un client écrit), les files relues toutes les
# `intervalle_secondes`. Un client : `{ slug, metier, missions: <adresse git
# de missions-<slug>> }` ; une mission de sa file qui nomme un autre métier
# est écartée. Le dossier de chaque chantier reste à l'agence
# (`.claude/missions/_chantiers/`) ; la file ne reçoit que le statut. Les clés
# SSH sont dans la config SSH de la machine.
agence:
  chantiers_max_par_jour: 3
  intervalle_secondes: 60
  clients: []

chantier:
  # Ce que le plan d'un chantier lit de la mémoire (R10).
  memoire_index_lignes: 60
  tours_max: 60
  budget_usd_par_mission: 10
  # Au-delà, la mission devait être découpée : « question pour l'atelier » (G1, condition 7).
  lignes_max: 600
  delai_secondes: 3600
  # Les règles d'outils de l'implémentation, bornées à l'arbre de travail
  # (`./**` : un `Write` nu écrit partout sur la machine, sondé le 2026-10-11) ;
  # le plan et la relecture n'ont que `outils_lecture`.
  # Les commandes, exactes : `git diff*` permettrait `--no-index` ou `--output=` hors de l'arbre.
  outils_autorises: ["Read(./**)", "Edit(./**)", "Write(./**)", "Glob(./**)", "Grep(./**)", "Bash(pnpm check)", "Bash(pnpm test)", "Bash(git diff)", "Bash(git diff origin/main...HEAD)", "Bash(git status)"]
  outils_lecture: ["Read(./**)", "Glob(./**)", "Grep(./**)", "Bash(git diff origin/main...HEAD)", "Bash(git log --oneline origin/main..HEAD)", "Bash(git status)"]
  # Le client des évals de traduction que le code rejoue dans l'arbre (G1, condition 4), par métier,
  # relatif à l'arbre ; un métier absent : la condition 4 refuse (PLAN-METIER-2.md M9).
  evals_clients: { securite-privee: exemples/client-fictif, agence-web: exemples/agence-web-fictive }
  # `${metier}` : le métier de la mission, résolu avant la garde ; un chantier ne touche que son métier.
  chemins_autorises: ["metiers/${metier}/code/src/**", "metiers/${metier}/evals/consignes.yaml", "metiers/${metier}/fiche.md", "memoire/**"]
  # Jamais, même dans la bande : les contrôles des règles (`controles.ts`, les échéances), l'accès
  # aux données du client (`connecteurs/`) ; tout métier les nomme ainsi (PLAN-METIER-2.md M9). Ni
  # un `CLAUDE*.md` : le binaire le chargerait comme consigne à la relecture et aux chantiers suivants.
  chemins_interdits: ["metiers/${metier}/code/src/controles.ts", "metiers/${metier}/code/src/echeances.ts", "metiers/${metier}/code/src/connecteurs/**", "metiers/${metier}/**/CLAUDE*.md"]
