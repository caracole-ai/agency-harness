# Les gestes appris écrits à la main pour l'éval de rejeu (PLAN-PROMOTION.md
# § 6.4), `pnpm evals gestes --client <dossier>`, sans modèle, seuil 100 %.
# Le lanceur pose chaque geste dans une copie du client (`gestes/eval-<id>.yaml`,
# statut proposé) et, pour chaque test, un instantané pris sur les données de
# la copie à `maintenant`, pour le rôle du test ; puis rejoue chaque geste de
# la copie (ceux du dossier passé en --client compris) sur ses instantanés.
#
# Chiffres à la main (client fictif, semaine du lundi 05/10 au dimanche 11/10,
# par jour de début, `planning.csv`) : Karim (A-1) V-01 + V-02 = 24 h ;
# Julien (A-2) V-04 12 h + V-05 4 h = 16 h ; Sophie (A-3) V-06 = 12 h.
# Écrit le 2026-10-10, jamais recopié d'une sortie du modèle.
#
# `liberer_un_jour` (PLAN-PROMOTION.md § 10, ajouté le 2026-10-11) : un geste
# qui écrit ; ses tests attendent les réaffectations, calculées à la main.
# Candidats : une carte valide le jour de la vacation, déclaré Dracar, carte
# d'entreprise remise, aucune vacation la veille, le jour ni le lendemain ;
# le premier par identifiant (ordre du texte : A-1 < A-11 < A-2 < A-5 < A-9).
# Carte, Dracar et remise : A-1, A-2, A-5, A-9, A-11 (A-3, A-4 expirées ;
# A-6 sans remise ; A-10 non déclaré ; A-7, A-8, A-12, A-13 sans carte).
#   Karim (A-1), mardi 13 : V-03 ; A-5 a V-09 le 12 → A-2, A-9, A-11 → A-11.
#   Sophie (A-3), mercredi 14 : V-07 ; A-1 a V-03 le 13 → A-2, A-5, A-9, A-11 → A-11.
#   Mehdi (A-9), vendredi 16 : V-14 ; A-1, A-2, A-5, A-11 (A-9 la tient) → A-1.

maintenant: "2026-10-10T21:40"

gestes:
  - id: heures_par_agent
    description: les heures faites par un agent sur une période, ou par celui qui parle
    roles: [patron, agent]
    parametres:
      agent:
        type: agent
        description: "l'agent, tel qu'il est écrit dans la consigne ; null pour celui qui parle"
      periode:
        type: periode
        description: la période demandée
    requetes:
      - nom: heures
        sql: SELECT a.nom AS nom, COALESCE(SUM(v.heures), 0) AS heures FROM agents a LEFT JOIN vacations v ON v.agent = a.id AND v.jour BETWEEN :du AND :au WHERE a.id = :agent GROUP BY a.id
    reponse:
      ligne: "{{heures.nom}} : {{heures.heures}} heures du {{du}} au {{au}}."
      tableau: null
      vide: Aucune vacation sur cette période.
    tests:
      - echappee: E-eval-heures-1
        consigne: "Combien d'heures Karim a-t-il fait cette semaine ?"
        role: patron
        agent: null
        params: { agent: A-1, du: "2026-10-05", au: "2026-10-11" }
        instantane: echappees/E-eval-heures-1.json
        contient: ["24", Haddad]
      - echappee: E-eval-heures-2
        consigne: "Combien d'heures Julien a-t-il fait du 5 au 11 octobre ?"
        role: patron
        agent: null
        params: { agent: A-2, du: "2026-10-05", au: "2026-10-11" }
        instantane: echappees/E-eval-heures-2.json
        contient: ["16", Lefèvre]
      - echappee: E-eval-heures-3
        consigne: "Combien d'heures j'ai fait cette semaine ?"
        role: agent
        agent: A-3
        params: { agent: A-3, du: "2026-10-05", au: "2026-10-11" }
        instantane: echappees/E-eval-heures-3.json
        contient: ["12", Marchand]
    origine: { fabrique_le: "2026-10-10", modele: à la main, cout_usd: 0, conversations: [] }
  - id: liberer_un_jour
    description: libérer un agent de ses vacations d'un jour, chacune proposée à un agent libre autour de ce jour
    roles: [patron]
    parametres:
      agent:
        type: agent
        description: "l'agent à libérer, tel qu'il est écrit dans la consigne"
      date:
        type: date
        description: le jour à libérer
    requetes:
      - nom: liberer
        sql: SELECT v.id AS vacation, (SELECT a.id FROM agents a WHERE a.id <> v.agent AND a.carte_au >= v.jour AND a.declare_dracar = 'oui' AND a.carte_entreprise_remise = 'oui' AND NOT EXISTS (SELECT 1 FROM vacations w WHERE w.agent = a.id AND w.jour BETWEEN date(v.jour, '-1 day') AND date(v.jour, '+1 day')) ORDER BY a.id LIMIT 1) AS agent FROM vacations v WHERE v.agent = :agent AND v.jour = :date
    modifications:
      pour_chaque: liberer
      reaffecter: { vacation: vacation, agent: agent }
    reponse:
      ligne: null
      tableau: liberer
      vide: Aucune vacation ce jour-là.
    tests:
      - echappee: E-eval-liberer-1
        consigne: "Libère le mardi 13 de Karim."
        role: patron
        agent: null
        params: { agent: A-1, date: "2026-10-13" }
        instantane: echappees/E-eval-liberer-1.json
        contient: []
        modifications: [{ vacation: V-03, agent: A-11 }]
      - echappee: E-eval-liberer-2
        consigne: "Libère le mercredi 14 de Sophie."
        role: patron
        agent: null
        params: { agent: A-3, date: "2026-10-14" }
        instantane: echappees/E-eval-liberer-2.json
        contient: []
        modifications: [{ vacation: V-07, agent: A-11 }]
      - echappee: E-eval-liberer-3
        consigne: "Libère le vendredi 16 de Mehdi."
        role: patron
        agent: null
        params: { agent: A-9, date: "2026-10-16" }
        instantane: echappees/E-eval-liberer-3.json
        contient: []
        modifications: [{ vacation: V-14, agent: A-1 }]
    origine: { fabrique_le: "2026-10-11", modele: à la main, cout_usd: 0, conversations: [] }
