# Les cas de `pnpm evals ronde` (PLAN-RONDE.md § 5.4, amendé § 0.c).
#
# Des journaux fixés : copies du journal de deux copies du client fictif,
# remplies le 2026-10-11 par de vraies consignes (`pnpm parler`, GLM-5.3 via
# GMI), sans les lignes `outil_echappee` (les résultats de requête). Le lanceur
# les rejoue sur une copie fraîche du client et lance la ronde à la date du cas.
#   journal-a : le 2026-10-09, 5 consignes ; le 2026-10-10, 15 consignes
#               (heures ×4, simulations d'absence ×2, comptes de vacations ×2,
#               cartes non renseignées, cartes expirées, échéances ×3,
#               planning, une paie que l'outil ne sait pas faire).
#   journal-c : le 2026-10-11, quatre gestes du catalogue, rien d'autre.
#
# ÉTIQUETTES : BROUILLON de la session D1 (2026-10-11), écrit après lecture du
# résumé (`pnpm ronde --sans-modele`) et AVANT toute passe réelle sur ces
# journaux. Ce ne sont pas celles de Lionel : le résultat s'écrit « brouillon,
# pas une mesure ». Lionel relit chaque résumé, remplace les missions
# attendues par les siennes, met `etiquettes: lionel`, et relance : c'est la
# mesure (seuil fixé après cette première passe).
#
# Une mission attendue est trouvée si sa sorte et toutes ses intentions sont
# dans une mission retenue (statut « à faire » ou « question pour l'atelier »),
# ou au moins deux de ses échappées. Une mission « promotion en cours » ou
# « écartée » par le code n'est pas comptée : le code l'a neutralisée.
etiquettes: brouillon

journaux:
  a: rondes/journal-a.json
  c: rondes/journal-c.json

cas:
  # Le 9 : chaque demande vue une seule fois (heures, simulation, gilets) ;
  # rien ne revient, rien ne mérite une mission.
  - id: R-1
    journal: a
    date: "2026-10-09"
    attendu:
      rien_a_signaler: true

  # Le 10 : heures_par_agent (5 en 30 jours) et simuler_absence (3) sont au
  # seuil de promotion : « promotion en cours », pas de mission. Deux
  # intentions de lecture voisines (cartes non renseignées, cartes expirées),
  # posées à la suite, puis le geste des échéances trois fois : une
  # factorisation. compter_vacations (2) n'est pas encore au seuil.
  - id: R-2
    journal: a
    date: "2026-10-10"
    attendu:
      rien_a_signaler: false
      missions:
        - sorte: factorisation
          intentions: [agents_sans_carte, cartes_expirees]
          echappees: [E-20261010T1040-a2b0, E-20261010T1100-9207]

  # Le 11, sur un autre journal : quatre gestes du catalogue, aucune demande
  # nouvelle, aucun « je ne sais pas » : rien à signaler.
  - id: R-3
    journal: c
    date: "2026-10-11"
    attendu:
      rien_a_signaler: true
