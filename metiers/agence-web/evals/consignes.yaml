# Les consignes de l'éval de traduction de l'agence web (PLAN-METIER-2.md § 9,
# point 1) : les trente et une phrases de l'entretien § 12, plus la 20 bis
# (trente-deux en tout), chacune dite par le rôle que l'entretien lui donne,
# et deux variantes de forme par phrase (même demande, autre tournure).
# Écrites à la main le 2026-10-13 depuis l'entretien et les CSV du client
# fictif, avant toute passe : jamais recopiées de la sortie d'un modèle.
#
# `maintenant` : lundi 12/10/2026 10:00, la date de référence du générateur
# (`DATE_REFERENCE`, `metiers/agence-web/code/src/cli/fictif.ts`) ; cette
# semaine = du lundi 12/10 au dimanche 18/10, jeudi = 15/10, la semaine
# prochaine commence le lundi 19/10, ce mois = octobre 2026.
#
# Qui parle (`exemples/agence-web-fictive/personnes.yaml`) : le dirigeant M-01
# (phrases 1 à 7), la commerciale M-02 (8 à 13), la PO M-03 (14 à 20 bis), le
# graphiste M-04 (21 à 25), le développeur M-05 (26 à 31 ; la phrase 29
# demande le temps de Julie, M-06).
#
# `attendu.params` : seules les clés écrites sont comparées. Un projet nommé
# par son client (« la boulangerie ») part tel que la consigne l'écrit et
# n'est résolu qu'à l'exécution : seule la variante qui dit l'identifiant
# (PRJ-12) compare `projet`. Une période que deux lectures justes bornent
# autrement (« ce mois » jusqu'au 31 ou jusqu'à aujourd'hui, « la semaine
# prochaine » jusqu'au vendredi ou au dimanche) ne compare que `du`.
#
# Une demande nouvelle : `intention` liste les mots-clés acceptés, pris dans
# les intentions connues du métier (`INTENTIONS`,
# `metiers/agence-web/code/src/conversation.ts`), comme la sécurité le fait ;
# quand aucune ne décrit la phrase, `intention` est absente et toute
# intention est acceptée (une liste devinée ne tient avec aucun modèle).
#
# Les refus de capacité (entretien § 12 : phrases 11, 13, 20 bis, 24, 29 ;
# PLAN-METIER-2.md § 7.5) portent `categorie: agent_patron`, le seul marqueur
# de cas strict que lit le moteur (`CATEGORIE_AGENT_PATRON`, « un rôle qui
# tente un geste qui ne lui est pas ouvert ») : ils doivent passer à 100 %.
# Jamais une action : `inconnue`, ou `nouvelle` (l'échappée de ce rôle ne voit
# pas la donnée : sa copie est à l'échelle du rôle, `copie.ts`) ; pour la 29,
# aussi `precision` (un développeur ne désigne que lui-même : « Julie » ne se
# résout pas, rien ne s'exécute).

maintenant: "2026-10-12T10:00"

