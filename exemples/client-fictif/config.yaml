# Client fictif de la sécurité privée : sert aux démonstrations et aux tests.
# Aucune donnée réelle. La config d'un vrai client vit dans clients/<slug>/,
# jamais versionnée.
# Les noms des agents sont inventés, d'origines et de genres mêlés, et les
# erreurs posées sont réparties sans lien avec l'origine des noms : la démo ne
# doit associer aucun groupe à une faute.
client: client fictif (sécurité privée)
metier: securite-privee

# Sans politique, la loi générale décide (I-05 : 11 h de repos). Un client
# qui applique l'accord de 1993 l'écrirait ainsi :
#   politique:
#     lectures_reference:
#       I-05: accord-1993

donnees:
  agents: agents.csv
  postes: postes.csv
  planning: planning.csv

journal: journal.sqlite

remplacement:
  # Comment classer les remplaçants possibles, dans l'ordre de préférence du
  # patron (valeurs d'exemple, à demander au client). Catalogue :
  # connait_site, moins_d_heures_semaine.
  preferences: [connait_site, moins_d_heures_semaine]
  # Sans réponse de l'agent sollicité après ce délai, on passe au suivant.
  attente_reponse_minutes: 30

veiller:
  # Valeurs d'exemple, à demander au client : quand prévenir, et combien de
  # temps il faut pour agir (en dessous, l'alerte est escaladée).
  echeances:
    depot_renouvellement: { alerter: { mois: 1 }, preparation: { jours: 7 } }
    mac: { alerter: { mois: 2 }, preparation: { mois: 1 } }
    recyclage_ssiap: { alerter: { mois: 2 }, preparation: { mois: 1 } }
    secourisme: { alerter: { mois: 2 }, preparation: { mois: 1 } }
    habilitation_electrique: { alerter: { mois: 2 }, preparation: { mois: 1 } }

conversation:
  modele:
    fournisseur: anthropic
    # Référence jusqu'à nouvel ordre (Lionel, 2026-10-08) : GLM-5.3 chez GMI
    # Cloud, par son point d'accès au format Anthropic. Prix GMI relevés le
    # 2026-10-08, en dollars par million de tokens. La clé reste dans la
    # variable nommée, jamais ici. GMI ignore les outils stricts et « un seul
    # outil par tour » : le harnais le tient quand même.
    id: zai-org/GLM-5.3
    prix_par_million_usd: { entree: 1.4, sortie: 4.4, cache_ecrit: 0, cache_lu: 0.26 }
    effort: { traduire: low, echappee: medium }
    acces: { url: "https://api.gmi-serving.com", authentification: bearer, variable_cle: GMI_API_KEY }
    # Pour l'API d'Anthropic (prix relevés le 2026-10-07), retirer `acces` (la
    # clé est alors lue dans ANTHROPIC_API_KEY) et mettre :
    #   id: claude-opus-5-5
    #   prix_par_million_usd: { entree: 4, sortie: 20, cache_ecrit: 5, cache_lu: 0.2 }
    #   plafonds.par_demande: { tours: 12, tokens_sortie: 6000, secondes: 120 }
  plafonds:
    # Relevés pour GLM : jusqu'à 45 s par appel, et sa réflexion est longue.
    par_demande: { tours: 12, tokens_sortie: 12000, secondes: 240 }
    par_mois_usd: 30
  # conservation_jours : les instantanés des échappées (echappees/<id>.json)
  # sont purgés passé ce délai par `pnpm promotions`, sauf ceux qu'un geste
  # appris cite dans ses tests.
  promotion: { occurrences: 3, jours: 30, conservation_jours: 90 }
