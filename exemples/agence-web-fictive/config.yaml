# Client fictif de l'agence web (PLAN-METIER-2.md § 7.1, M16) : sert aux
# démonstrations et aux tests. Aucune donnée réelle. Les CSV sont la sortie
# du générateur (`pnpm --filter @harnais/agence-web fictif --vers …`) ; les
# noms sont inventés, d'origines et de genres mêlés, et les erreurs posées
# sont réparties sans lien avec les noms.
client: agence web fictive
metier: agence-web

donnees:
  personnes: personnes.csv
  clients: clients.csv
  contacts: contacts.csv
  projets: projets.csv
  lots: lots.csv
  devis: devis.csv
  avenants: avenants.csv
  tickets: tickets.csv
  temps: temps.csv
  factures: factures.csv
  paiements: paiements.csv
  relances: relances.csv
  contrats_tma: contrats_tma.csv
  recettes: recettes.csv
  acces: acces.csv
  depots: depots.csv
  sauvegardes: sauvegardes.csv
  domaines: domaines.csv
  sous_traitants: sous_traitants.csv
  versions: versions.csv

journal: journal.sqlite

# Valeurs déclarées par le dirigeant (entretien § 1, § 9), à confirmer.
# heures_par_jour : la valeur du générateur (HEURES_PAR_JOUR_FICTIF).
# facture_alerte : valeur d'exemple, l'entretien ne la chiffre pas ; au-delà
# de tout le vendu, ce qui est facturé l'est sans devis signé.
seuils:
  forfait_alerte: 0.9
  forfait_refus: 1.1
  tma_alerte: 0.8
  facture_alerte: 1
  delegation_eur_ht: 5000
  remise_max: 0.1
  heures_par_jour: 7

veiller:
  # Valeurs d'exemple tirées de l'entretien § 8 : quand prévenir, et combien
  # de temps il faut pour agir (en dessous, l'alerte est escaladée). Une
  # relance se fait en dix minutes : préparation nulle, alerte le jour même.
  echeances:
    facture_echeance: { alerter: { jours: 0 }, preparation: { jours: 0 } }
    fin_garantie: { alerter: { mois: 1 }, preparation: { jours: 7 } }
    fin_tma: { alerter: { mois: 1 }, preparation: { mois: 1 } }
    domaine: { alerter: { jours: 30 }, preparation: { jours: 7 } }
    certificat: { alerter: { jours: 30 }, preparation: { jours: 7 } }
    fin_support: { alerter: { mois: 6 }, preparation: { mois: 1 } }
    attestation_urssaf: { alerter: { mois: 1 }, preparation: { jours: 7 } }
    pv_non_signe: { alerter: { jours: 0 }, preparation: { jours: 0 } }
    devis_sans_reponse: { alerter: { jours: 0 }, preparation: { jours: 0 } }
  # Les délais de la maison qui font la limite d'une échéance (entretien § 8,
  # § 39) : premier rappel d'une facture, relance d'un PV, d'un devis.
  delais:
    relance_facture: { jours: 1 }
    pv_non_signe: { jours: 15 }
    devis_sans_reponse: { jours: 10 }
conversation:
  modele:
    fournisseur: anthropic
    # Référence depuis le 2026-10-14 (Lionel) : Sonnet 5.5 par l'abonnement
    # claude.ai, le binaire de Claude Code (le même accès que la ronde :
    # `claude auth status` connecté, ANTHROPIC_API_KEY absente). Prix en
    # dollars par million de tokens, déduits du coût que rapporte le binaire
    # le 2026-10-14 (écriture de cache à 1 h) : une estimation, l'abonnement
    # ne facture pas à l'appel.
    id: claude-sonnet-5-5
    prix_par_million_usd: { entree: 2, sortie: 10, cache_ecrit: 4, cache_lu: 0.1 }
    effort: { traduire: low, echappee: medium }
    acces: { binaire: claude }
    # GLM-5.3 chez GMI Cloud (référence du 2026-10-08 au 2026-10-14, prix GMI
    # relevés le 2026-10-08 ; GMI ignore les outils stricts et « un seul outil
    # par tour », le harnais le tient quand même) :
    #   id: zai-org/GLM-5.3
    #   prix_par_million_usd: { entree: 1.4, sortie: 4.4, cache_ecrit: 0, cache_lu: 0.26 }
    #   acces: { url: "https://api.gmi-serving.com", authentification: bearer, variable_cle: GMI_API_KEY }
    # Pour l'API d'Anthropic (prix relevés le 2026-10-07), retirer `acces` (la
    # clé est alors lue dans ANTHROPIC_API_KEY) et mettre :
    #   id: claude-opus-5-5
    #   prix_par_million_usd: { entree: 4, sortie: 20, cache_ecrit: 5, cache_lu: 0.2 }
    #   plafonds.par_demande: { tours: 12, tokens_sortie: 6000, secondes: 120 }
  plafonds:
    # Relevés pour GLM : jusqu'à 45 s par appel, et sa réflexion est longue.
    # Le même calibrage que le client fictif de la sécurité (S8) : deux
    # échappées coupées à 12 000 tokens (E-15, E-20) et une au plafond de
    # temps (E-15 : 6 616 tokens en 355 s, GMI à 18 tokens/s ce jour-là).
    par_demande: { tours: 12, tokens_sortie: 20000, secondes: 420 }
    par_mois_usd: 30
